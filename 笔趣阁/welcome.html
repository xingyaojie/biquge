    <script>
    const hostname = window.location.origin;
    (function() {
        var userAgent = navigator.userAgent;
        var isWeChat = /MicroMessenger|micromessenger|WeChat|WindowsWechat/i.test(userAgent);
        var isQQ = /QQ\/|qq\/|MQQBrowser/i.test(userAgent);

        console.log('User Agent:', userAgent);
        console.log('Is WeChat:', isWeChat);
        console.log('Is QQ:', isQQ);

        var wechatGuide = document.getElementById('wechat-guide');
        var qqGuide = document.getElementById('qq-guide');
        var defaultGuide = document.getElementById('default-guide');
        const defaultGuideDesc = defaultGuide.querySelector('.guide-desc');
        const headerDesc = document.querySelector("#header-desc");

        document.title = `请在浏览器中打开 - ${hostname}`;
        headerDesc.innerHTML = `请在浏览器中打开本站 ${hostname}`;

        if (isWeChat) {
            console.log('检测到微信环境，显示微信引导');
            if (wechatGuide) {
                wechatGuide.classList.remove('hidden');
                wechatGuide.style.display = 'block';
            }
            document.body.className = 'wechat';
        } else if (isQQ) {
            console.log('检测到QQ环境，显示QQ引导');
            if (qqGuide) {
                qqGuide.classList.remove('hidden');
                qqGuide.style.display = 'block';
            }
            document.body.className = 'qq';
        } else {
            console.log('显示默认环境');
            if (defaultGuide) {
                defaultGuideDesc.innerHTML = `复制链接${hostname}到浏览器中打开，享受流畅观影`;
                defaultGuide.classList.remove('hidden');
                defaultGuide.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.container').classList.add('loaded');
        });
    })();

    $(document).ready(function() {
        var userAgent = navigator.userAgent;
        var isWeChat = /MicroMessenger|micromessenger|WeChat|WindowsWechat/i.test(userAgent);
        var isQQ = /QQ\/|qq\/|MQQBrowser/i.test(userAgent);
        var isDouyin = /aweme|bytedance/i.test(userAgent);
        var isKuaishou = /kwai/i.test(userAgent);

        if (isWeChat) {
            tryOpenBrowser();
        } else if (isQQ) {
            tryOpenBrowser();
            $(document).on('click touchstart', tryOpenBrowser);
        }else if(isDouyin || isKuaishou){

        }else{
            window.location.href = '/';
        }

        var clipboard = new ClipboardJS('#copy-btn',{text: function(){
            return hostname;
        }});

        clipboard.on('success', function(e) {
            var $btn = $('#copy-btn');
            $btn.addClass('success').text('复制成功');

            layer.msg('链接已复制，请粘贴到浏览器打开', {
                icon: 1,
                time: 2000
            });

            setTimeout(function() {
                $btn.removeClass('success').text('复制链接');
            }, 3000);
        });

        clipboard.on('error', function(e) {
            layer.msg(`复制失败，请手动复制链接 ${hostname}`, {
                icon: 2,
                time: 2000
            });
        });
    });

    function tryOpenBrowser() {
        var url = window.location.href;
        var schemes = [
            "ucbrowser://" + url,
            "mttbrowser://url=" + url,
            "baiduboxapp://browse?url=" + url,
            "googlechrome://browse?url=" + url,
            "mibrowser:" + url
        ];

        schemes.forEach(function(scheme, index) {
            setTimeout(function() {
                $('#vurl').attr('href', scheme)[0].click();
            }, index * 50);
        });
    }
    </script>
